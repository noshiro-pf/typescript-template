name: TypeScript Version Compatibility

# Verifies that the built `dist/` declarations (resolved through the real
# package.json `exports` map, see test/dist/) type-check on the range of
# TypeScript versions consumers may be using — not just the repository's own
# compiler.

on:
  push:
    branches-ignore:
      - 'develop'
      - 'develop*'
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'docs/**'
      - 'documents/**'
      - '.gitignore'
      - '.cspell.config.yaml'
      - '.editorconfig'
      - '.markdownlint-cli2.mjs'
      - 'LICENSE'

  workflow_dispatch:

jobs:
  test-typescript-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        ts-version: ['5.1', '5.4', '5.7', '5.9', 'latest']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build:min emits dist/ and links the package into
      # test/dist/node_modules without running the repository's own checks
      # (those are covered by the lint workflow).
      - name: Build
        run: pnpm run build:min

      # The `prepare` script links `@typescript/lib-*` to `strict-ts-lib-v7.0`
      # so that ESLint sees the strict standard library. Those names have to go
      # before this matrix runs: TypeScript 5.0-5.7 have no `libReplacement`
      # option and do the lookup unconditionally, so every compiler in the
      # matrix would pick up a lib set written for TypeScript 6 and fail on it
      # (TS2317, TS2727, ...) rather than on anything this package ships.
      # A consumer has no such names installed, which is exactly what this
      # workflow is meant to reproduce.
      - name: Remove the strict standard library link
        run: pnpm exec strict-ts-lib-v7.0-link --unlink

      - name: Type-check dist output (named imports) with TypeScript ${{ matrix.ts-version }}
        run: npx -y -p typescript@${{ matrix.ts-version }} tsc -p ./test/dist/named/tsconfig.json
